<!doctype html>
<html lang="uk" data-theme="dark" data-glass="medium" data-refraction="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://api.audius.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=cyrillic,latin&display=swap"
    />
    <title>Хвиля — Музичний плеєр</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('wave-settings');
          var parsed = raw ? JSON.parse(raw) : null;
          var pref = parsed && (parsed.theme || (parsed.state && parsed.state.theme)) || 'dark';
          var glass = parsed && (parsed.glassIntensity || (parsed.state && parsed.state.glassIntensity)) || 'medium';
          var refract = parsed && (typeof parsed.refractionEnabled === 'boolean' ? parsed.refractionEnabled : parsed.state && typeof parsed.state.refractionEnabled === 'boolean' ? parsed.state.refractionEnabled : true);
          var resolved =
            pref === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref === 'light'
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.glass =
            glass === 'low' || glass === 'high' ? glass : 'medium';
          document.documentElement.dataset.refraction = refract === false ? 'off' : 'on';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', resolved === 'light' ? '#e9eff8' : '#070a12');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.glass = 'medium';
          document.documentElement.dataset.refraction = 'on';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
